version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-learning-cache
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-ttl

volumes:
  redis_data:
